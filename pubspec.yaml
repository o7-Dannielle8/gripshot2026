name: gripshot
description: A local storage-based shot sharing application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # Database
  sqflite: ^2.3.2
  path: ^1.9.0
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  # UI
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  # Image handling
  image_picker: ^1.0.7
  path_provider: ^2.1.1
  # Utils
  intl: ^0.18.1
  uuid: ^4.2.1
  google_fonts: ^6.1.0
  flutter_blue_plus: ^1.31.15  # For Bluetooth functionality
  permission_handler: ^11.3.0  # For handling permissions
  location: ^5.0.3  # For handling location services
  fl_chart: ^0.65.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo.png 